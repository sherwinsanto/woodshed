# Local development stack. Run with: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: woodshed
      POSTGRES_PASSWORD: woodshed
      POSTGRES_DB: woodshed
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodshed"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://woodshed:woodshed@db:5432/woodshed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
