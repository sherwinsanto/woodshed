# Local development stack. Run with: docker compose up --build

# Storage settings shared by every service that talks to storage.
x-storage-env: &storage-env
  S3_ENDPOINT_URL: http://storage:9000
  S3_ACCESS_KEY_ID: woodshed
  S3_SECRET_ACCESS_KEY: woodshed-secret
  S3_BUCKET: woodshed

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: woodshed
      POSTGRES_PASSWORD: woodshed
      POSTGRES_DB: woodshed
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodshed"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage, standing in for Cloudflare R2 locally.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: woodshed
      RUSTFS_SECRET_KEY: woodshed-secret
    ports:
      - "9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once: creates the bucket and its CORS rules, then exits.
  storage-init:
    build: ./api
    command: ["python", "-m", "app.init_storage"]
    environment: *storage-env
    depends_on:
      storage:
        condition: service_healthy

  api:
    build: ./api
    environment:
      <<: *storage-env
      DATABASE_URL: postgresql://woodshed:woodshed@db:5432/woodshed
      # Browsers can't reach http://storage:9000, so presigned URLs use this address.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  db-data:
  storage-data:
